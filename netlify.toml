[build]
  base = "frontend"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://4h-1h-trading-algo-production.up.railway.app"

[[redirects]]
  from = "/api/*"
  to = "https://4h-1h-trading-algo-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[images]
  remote_images = ["https*"]
