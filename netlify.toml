[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://4h-1h-trading-algo-production.up.railway.app"

# API proxy - forward /api/* to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://4h-1h-trading-algo-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback - all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[images]
  remote_images = ["https*"]
